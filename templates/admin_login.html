<!DOCTYPE html>
<html>

<head>

<title>Admin Login</title>

<style>

body {
            font-family: Arial, sans-serif;
            background: url("{{ url_for('static', filename='images/bg3.png') }}") no-repeat center center fixed;
            background-size: cover;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin:0;
        }

form{
background:hwb(29 73% 5% / 0.902);
padding:45px;
display:inline-block;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
width:350px;
}
h2 {
            text-align: center;
            color: hwb(0 7% 93%);
            margin-bottom: 20px;
            font-size: 28px;
        }
input{
display:block;
margin:15px auto;
padding:12px;
width:90%;
font-size: 16px;
}

button{
padding:10px 20px;
background:hsl(228, 56%, 62%);
color:white;
border:none;
cursor:pointer;
width:100%;
font-size:16px;
border-radius:5px;
}

</style>

</head>

<body>

<form method="POST">
<h2>Admin Login</h2>
<input type="text" name="username" placeholder="Admin Username" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

</body>
</html>
